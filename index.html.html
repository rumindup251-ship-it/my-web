  <!DOCTYPE html>
<html>
<head>
    <title>My Mini Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* NAVBAR */
        .navbar {
            background: #1877F2;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        /* SECTIONS */
        section {
            padding: 50px;
            text-align: center;
        }

        #home {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }

        #about {
            background: #f1f1f1;
        }

        #contact {
            background: #ddd;
        }

        /* LOGIN BOX */
        .login-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1877F2;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0f5bd3;
        }

        .msg {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="#home">Home</a>
    <a href="#login">Login</a>

<script>
function login() {
